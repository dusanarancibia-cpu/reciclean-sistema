<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supervisión MVP · Primer Release</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2ea;
      --paper: #fffef9;
      --ink: #172018;
      --muted: #667062;
      --line: #d5ddd2;
      --brand: #1f6a44;
      --brand-2: #0e4127;
      --warn: #9f4d31;
      --warn-bg: #fbefe9;
      --ok: #19563a;
      --ok-bg: #ecf8f0;
      --shadow: 0 18px 40px rgba(23, 32, 24, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(31, 106, 68, 0.10), transparent 30%),
        linear-gradient(180deg, #f8faf6 0%, var(--bg) 100%);
      color: var(--ink);
    }
    button, input, select, textarea { font: inherit; }
    .shell { width: min(1320px, calc(100vw - 32px)); margin: 0 auto; padding: 24px 0 48px; }
    .shell-center { min-height: 100vh; display: grid; place-items: center; }
    .card, .stat-card {
      background: color-mix(in srgb, var(--paper) 92%, white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card { padding: 20px; }
    .auth-card { width: min(460px, calc(100vw - 32px)); }
    .loading-card { display:grid; place-items:center; gap:12px; min-width:min(360px, calc(100vw - 32px)); padding:40px 28px; }
    .loader { width:40px; height:40px; border-radius:50%; border:4px solid rgba(31,106,68,.12); border-top-color:var(--brand); animation:spin .9s linear infinite; }
    .topbar, .topbar-actions, .card-head, .timeline-meta { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(1.9rem, 3vw, 2.7rem); }
    h2 { font-size: 1rem; }
    .eyebrow {
      display:inline-flex; align-items:center; gap:8px; margin-bottom:8px; padding:6px 10px;
      border:1px solid rgba(31, 106, 68, 0.14); border-radius:999px; background:rgba(31, 106, 68, 0.08);
      color:var(--brand); font-size:.82rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    }
    .subtle { color: var(--muted); line-height: 1.5; max-width: 72ch; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px;
      border:1px solid var(--line); border-radius:999px; background:white; color:var(--ink); cursor:pointer; transition:.16s ease; text-decoration:none;
    }
    .btn:hover:not(:disabled) { transform:translateY(-1px); border-color:var(--brand); }
    .btn:disabled { cursor:wait; opacity:.6; }
    .btn-primary { background:linear-gradient(135deg, var(--brand), var(--brand-2)); border-color:transparent; color:white; }
    .flash { margin-top:16px; padding:14px 16px; border-radius:16px; border:1px solid transparent; }
    .flash-ok { color:var(--ok); background:var(--ok-bg); border-color:rgba(25,86,58,.18); }
    .flash-error { color:var(--warn); background:var(--warn-bg); border-color:rgba(159,77,49,.18); }
    .stats { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:12px; margin:18px 0; }
    .stat-card { padding:16px; display:grid; gap:6px; }
    .stat-card span, .status, .badge, .list-main span, .timeline-date, .mini-card span, .mini-card small, .metric span { color:var(--muted); font-size:.86rem; }
    .stat-card strong, .metric strong, .mini-card strong { font-size:1.1rem; }
    .layout { display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(360px, .95fr); gap:18px; margin:18px 0; }
    .layout.lower { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); }
    .stack { display:grid; gap:16px; }
    .grid, .metric-grid, .subgrid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin-top:14px; }
    .compact-grid { grid-template-columns:repeat(3, minmax(0, 1fr)); }
    .field { display:grid; gap:8px; }
    .field span { font-size:.84rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
    .field input, .field select {
      width:100%; min-height:46px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:white; color:var(--ink);
    }
    .metric, .mini-card, .timeline-item {
      padding:14px; border-radius:16px; background:rgba(23,32,24,.03); border:1px solid rgba(23,32,24,.06); display:grid; gap:6px;
    }
    .list { display:grid; gap:10px; margin-top:16px; max-height:720px; overflow:auto; padding-right:4px; }
    .list-item {
      display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left;
      padding:14px; border-radius:16px; border:1px solid rgba(23,32,24,.08); background:white; cursor:pointer;
    }
    .list-item.active { border-color:var(--brand); background:rgba(31,106,68,.05); }
    .list-main, .list-side, .timeline { display:grid; gap:4px; }
    .list-side { justify-items:end; }
    .status, .badge { padding:8px 12px; border-radius:999px; background:rgba(23,32,24,.05); border:1px solid rgba(23,32,24,.06); }
    .empty { padding:18px; margin-top:14px; border-radius:16px; background:rgba(23,32,24,.04); color:var(--muted); }
    .subsection-title { font-size:.92rem; margin-bottom:10px; color:var(--ink); }
    .stack, .timeline { margin-top: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1180px) {
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .layout, .layout.lower { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .shell { width:min(100vw - 20px, 100%); padding-top:16px; }
      .stats, .grid, .compact-grid, .metric-grid, .subgrid { grid-template-columns:1fr; }
      .list-item { align-items:flex-start; }
      .list-side { justify-items:start; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/supervision-mvp.js"></script>
</body>
</html>
