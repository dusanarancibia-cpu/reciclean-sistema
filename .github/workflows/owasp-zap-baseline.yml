name: OWASP ZAP Baseline · Pieza #8 Plan 99-99 (HTML L432 + L417)

# Guardia GH bloqueante sobre PCs (R-AUD-083)
# Escaneo DAST contra superficie pública panel-rdo · informe-only inicial.
# Para activar bloqueante en PR: descomentar el step "Fail on alerts" y marcar required en branch protection.

on:
  # FIX C2.a-style (17-jun-2026): paths filter removido del trigger
  # pull_request para evitar deadlock estructural con ZAP Baseline scan como
  # required check. Sin esto, todo PR meta-CI que no toque public/** o
  # supabase/functions/** queda BLOQUEADO indefinidamente.
  # Mismo patrón aplicado a lint-panel-rdo.yml en PR #319 y k6.yml en este PR.
  # Costo: ZAP corre ~2-3 min en cada PR (overhead aceptable para guardia
  # bloqueante real Plan 99-99 Pieza #8).
  # action-full-scan (post PR #333) respeta fail_action=false · no bloquea por
  # alertas baseline.
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'  # Lunes 09:00 CLT scan baseline semanal
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL objetivo del escaneo (default panel-rdo prod)'
        required: false
        default: 'https://panel-rdo.vercel.app'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  zap-baseline:
    name: ZAP Baseline scan (informe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FIX 17-jun-2026 (R2): action-baseline@v0.12.0 ignora fail_action:false
      # y reporta conclusion=FAILURE igual ante cualquier alerta. Reemplazado
      # por action-full-scan@v0.12.0 que respeta el flag · misma cobertura
      # baseline en modo informe-only · destraba mergeStateStatus UNSTABLE
      # de PRs que tocan public/**.
      - name: ZAP Baseline Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ inputs.target_url || 'https://panel-rdo.vercel.app' }}
          fail_action: false  # ☢️ informe-only · NO bloquea hasta tuning manual Pablo
          artifact_name: zap-baseline-report
          allow_issue_writing: true
          cmd_options: '-a -j -m 5 -T 60'

      - name: Comment summary on schedule
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Pieza #8 Plan 99-99 · ZAP baseline weekly scan completed · revisar artifact zap-baseline-report');
