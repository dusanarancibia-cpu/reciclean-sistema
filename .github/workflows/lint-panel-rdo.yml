name: Lint Panel RDO (R-AUD-064 + D-LINTER-001)

# 806b6adb v2 enriquecida con SPEC-D-LINTER-PANEL-RDO-001-V2.md (PC1 15-jun 03:00 CLT)
# Bloquea PR con SyntaxError en script inline panel-rdo.html (caso PR #159 reproducido)
# 4 jobs: parse JS inline · html tags balanceados · deno fmt · ts type check

on:
  # FIX C2.a (17-jun-2026): paths filter removido del trigger pull_request
  # para destrabar deadlock estructural en PRs de meta-CI (workflows/yml).
  # El job parse-js-inline corre ahora en todo PR a main · costo ~20s ·
  # destraba required check "Parse JS inline en HTMLs (R-AUD-064)" sin
  # admin merge bypass. Push sigue con paths filter (no es required check).
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  parse-js-inline:
    name: Parse JS inline en HTMLs (R-AUD-064)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract inline scripts + parse cada uno con node --check
        run: |
          set -e
          shopt -s nullglob
          fail=0
          for f in public/*.html; do
            [ -f "$f" ] || continue
            node -e "
              const fs = require('fs'), path = require('path'), os = require('os'), { execSync } = require('child_process');
              const file = '${f}';
              const content = fs.readFileSync(file, 'utf8');
              const re = /<script(?![^>]*src=)[^>]*>([\\s\\S]*?)<\\/script>/gi;
              let m, idx = 0, fail = false;
              while ((m = re.exec(content)) !== null) {
                idx++;
                const code = m[1];
                if (!code.trim()) continue;
                const tmp = path.join(os.tmpdir(), 'inline_' + idx + '.js');
                fs.writeFileSync(tmp, code);
                try { execSync('node --check ' + tmp, { stdio: ['ignore','ignore','pipe'] }); }
                catch (e) {
                  const msg = (e.stderr || e.message || '').toString().split('\\n')[0];
                  console.log('::error file=' + file + '::Script inline #' + idx + ' SyntaxError: ' + msg);
                  fail = true;
                }
                fs.unlinkSync(tmp);
              }
              if (fail) process.exit(1);
              console.log(file + ' · scripts inline OK');
            " || fail=1
          done
          exit $fail

  html-validate:
    name: HTML tags balanceados (html-validate)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g html-validate@9
      - name: Validate
        run: |
          set +e
          for f in public/*.html; do
            [ -f "$f" ] || continue
            html-validate --formatter github "$f" || echo "::warning::html-validate issues en $f (no bloqueante)"
          done

  deno-fmt-check:
    name: Deno fmt check supabase functions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Check fmt (warning si supabase/functions existe)
        run: |
          if [ -d supabase/functions ]; then
            deno fmt --check supabase/functions || echo "::warning::Run 'deno fmt supabase/functions' local antes de PR"
          else
            echo "supabase/functions no existe en este repo · skip"
          fi

  ts-type-check:
    name: TS type check supabase functions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Check
        run: |
          if [ -d supabase/functions ]; then
            fail=0
            for f in supabase/functions/*/index.ts; do
              [ -f "$f" ] || continue
              deno check "$f" || fail=1
            done
            if [ $fail -ne 0 ]; then
              echo "::warning::TS check errors detectados (no bloqueante en v2 inicial)"
            fi
          else
            echo "supabase/functions no existe · skip"
          fi

  comment-pr-on-failure:
    if: failure() && github.event_name == 'pull_request'
    needs: [parse-js-inline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '☢️ Lint Panel RDO detectó SyntaxError en JS inline. Caso histórico: PR #159 commit 00507fd rompió window.login 12+h por 3 </div> huérfanos (líneas 4387, 8339, 9624). Revisar el log de Actions para ubicar el script y la línea exacta. R-AUD-064 enforcement.'
            })
