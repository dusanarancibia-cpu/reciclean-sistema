name: CodeQL · Pieza #1 Plan 99-99 (HTML L432)

# Guardia GH bloqueante sobre Claude (R-AUD-083)
# HTML #2 L432 literal: "security-review, codeql"
# Bloquea PR con vulnerabilidades de código detectadas por CodeQL.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Lunes 06:00 CLT scan completo

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          upload: always
