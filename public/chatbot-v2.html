<!--
═══════════════════════════════════════════════════════════════════
  CHATBOT RECICLEAN-FAREX · MVP v1
  Widget embebible standalone · Basado en el flujo v9 de Dusan
  Precios en vivo desde Supabase · Cotización vía WhatsApp deeplink

  Uso:
    - Abrir directo en navegador para probar
    - Embebible en reciclean.cl / farex.cl vía WPCode (ver README)
    - Compatible con iframe en cualquier sitio

  Autor: Claude · Para: Grupo Reciclean-Farex
  Fecha: 7 abril 2026 · Versión: 1.0 MVP
═══════════════════════════════════════════════════════════════════
-->
<style>
/* ═══════════════════════════════════════════════════════════════
   RESET Y NAMESPACE rf-bot-*
   Todos los estilos están prefijados para no afectar el sitio host
═══════════════════════════════════════════════════════════════════ */
#rf-bot-container, #rf-bot-container * { box-sizing:border-box; }
#rf-bot-container { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

/* ─────────────────────────────────────────────────────────────
   PALETA · rediseño visual (10-jul-2026) — de "WhatsApp dark mode
   genérico" (fondo #0b141a, burbujas #202c33/#005c4b calcadas de
   WhatsApp) a una base clara verde-agua propia de Reciclean-Farex.
   El verde de marca (#1A7A3C/#0F4B25, header + botón flotante) se
   mantiene intacto — es la identidad ya construida. Lo que cambia es
   el fondo y las superficies alrededor de ese verde, para que dejen
   de leerse "duras" y pasen a leerse "empresa seria, clara".
   Variables scoped a #rf-bot-container — no hay riesgo de fuga al
   sitio host (mismo namespace rf-bot-* de siempre).
───────────────────────────────────────────────────────────────── */
#rf-bot-container {
  --rf-bg: #F2F9F5;           /* fondo ventana/chat — verde-agua muy suave, no blanco puro */
  --rf-surface: #FFFFFF;       /* burbujas recibidas, tarjetas, opciones */
  --rf-surface-tint: #E6F4EC;  /* burbuja enviada (usuario), acentos suaves */
  --rf-border: #DCEBE2;        /* bordes de tarjetas/opciones */
  --rf-border-soft: #E8F3ED;   /* separadores finos */
  --rf-ink: #16281E;           /* texto principal — verde-negro, no negro puro */
  --rf-ink-muted: #4C6157;     /* texto secundario/hora — ≥4.5:1 sobre --rf-surface y --rf-bg */
  --rf-brand: #1A7A3C;         /* verde de marca — sin cambios */
  --rf-brand-dark: #0F4B25;    /* verde de marca oscuro — sin cambios */
  --rf-legal-bg: #EEF1FB;      /* tarjeta certificaciones/legal — distinta del verde a propósito */
  --rf-legal-border: #D7DDF3;
  --rf-legal-ink: #29335C;
  --rf-wa: #25d366;            /* verde WhatsApp — solo para el CTA de WhatsApp, es su propio color de marca */
  --rf-wa-dark: #128c7e;
}

/* Botón flotante tipo burbuja (bottom-right) */
#rf-bot-toggle {
  position:fixed; bottom:24px; right:24px; z-index:999998;
  width:64px; height:64px; border-radius:50%;
  background:linear-gradient(135deg,var(--rf-brand) 0%,var(--rf-brand-dark) 100%);
  border:none; cursor:pointer;
  color:#fff; font-size:30px;
  box-shadow:0 8px 28px rgba(26,122,60,.35), 0 2px 6px rgba(15,35,25,.15);
  display:flex; align-items:center; justify-content:center;
  transition:transform .25s ease, box-shadow .25s ease;
}
#rf-bot-toggle:hover { transform:scale(1.08); box-shadow:0 12px 32px rgba(26,122,60,.5); }
#rf-bot-toggle.open { background:linear-gradient(135deg,#3E5B4C 0%,#25392F 100%); }
#rf-bot-toggle .rf-pulse {
  position:absolute; inset:-4px; border-radius:50%;
  border:2px solid var(--rf-brand); opacity:0;
  animation:rfPulse 2s infinite;
}
@keyframes rfPulse { 0%{opacity:.8;transform:scale(1)} 100%{opacity:0;transform:scale(1.4)} }

/* Ventana del chat */
#rf-bot-window {
  position:fixed; bottom:100px; right:24px; z-index:999999;
  width:400px; height:640px; max-height:calc(100vh - 140px);
  background:var(--rf-bg); border-radius:18px;
  box-shadow:0 24px 60px rgba(15,35,25,.18), 0 4px 14px rgba(15,35,25,.1);
  overflow:hidden; display:none;
  flex-direction:column;
  border:1px solid var(--rf-border);
  animation:rfSlideUp .3s ease;
}
#rf-bot-window.open { display:flex; }
@keyframes rfSlideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

/* Header */
#rf-bot-header {
  background:linear-gradient(135deg,var(--rf-brand) 0%,var(--rf-brand-dark) 100%);
  padding:14px 18px;
  display:flex; align-items:center; gap:12px;
  flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.08);
}
#rf-bot-header .rf-avatar {
  width:42px; height:42px;
  background:linear-gradient(135deg,#F0D060,#eab308);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
#rf-bot-header .rf-brand { flex:1; min-width:0; }
#rf-bot-header .rf-name { font-size:15px; font-weight:700; color:#fff; line-height:1.2; }
#rf-bot-header .rf-status {
  font-size:11px; color:rgba(255,255,255,.8); margin-top:2px;
  display:flex; align-items:center; gap:5px;
}
#rf-bot-header .rf-status::before {
  content:""; width:8px; height:8px; border-radius:50%;
  background:#4ADE80; box-shadow:0 0 0 0 rgba(74,222,128,.7);
  animation:rfDot 2s infinite;
}
@keyframes rfDot { 0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)} 70%{box-shadow:0 0 0 6px rgba(74,222,128,0)} 100%{box-shadow:0 0 0 0 rgba(74,222,128,0)} }
#rf-bot-header .rf-close {
  background:rgba(255,255,255,.14); border:none;
  width:32px; height:32px; border-radius:50%;
  color:#fff; cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s;
}
#rf-bot-header .rf-close:hover { background:rgba(255,255,255,.24); }

/* Reset bar */
#rf-bot-resetbar {
  padding:8px 18px; background:var(--rf-surface);
  border-bottom:1px solid var(--rf-border-soft);
  flex-shrink:0;
  display:flex; justify-content:center;
}
#rf-bot-resetbar button {
  background:transparent; border:1px solid var(--rf-border);
  color:var(--rf-ink-muted); font-size:11px;
  padding:5px 14px; border-radius:12px; cursor:pointer;
  transition:all .15s;
  font-family:inherit;
}
#rf-bot-resetbar button:hover { border-color:var(--rf-brand); color:var(--rf-brand); }

/* Chat area — se retira el patrón decorativo tipo WhatsApp: fondo plano,
   menos "recargado", más lectura limpia */
#rf-bot-chat {
  flex:1; overflow-y:auto; padding:12px 10px;
  background:var(--rf-bg);
  display:flex; flex-direction:column; gap:4px;
}
#rf-bot-chat::-webkit-scrollbar { width:4px; }
#rf-bot-chat::-webkit-scrollbar-thumb { background:var(--rf-border); border-radius:2px; }

/* Date separator */
.rf-datesep { text-align:center; margin:8px 0; }
.rf-datesep span {
  background:var(--rf-surface-tint); color:var(--rf-ink-muted); font-size:11px;
  padding:3px 12px; border-radius:6px;
}

/* Bot bubble */
.rf-bot-msg { display:flex; align-items:flex-end; gap:6px; margin-bottom:2px; max-width:88%; align-self:flex-start; }
.rf-bot-bubble {
  background:var(--rf-surface); color:var(--rf-ink);
  border:1px solid var(--rf-border-soft);
  padding:9px 13px; border-radius:0 12px 12px 12px;
  font-size:13.5px; line-height:1.5;
  white-space:pre-wrap; word-break:break-word;
  position:relative; box-shadow:0 1px 2px rgba(15,35,25,.05);
}
.rf-bot-time { font-size:10px; color:var(--rf-ink-muted); margin-top:2px; margin-left:4px; }

/* User bubble — tinte verde suave en vez del verde-negro de WhatsApp */
.rf-user-msg { display:flex; align-items:flex-end; justify-content:flex-end; gap:6px; margin-bottom:2px; max-width:88%; align-self:flex-end; }
.rf-user-bubble {
  background:var(--rf-surface-tint); color:var(--rf-brand-dark);
  padding:9px 13px; border-radius:12px 0 12px 12px;
  font-size:13.5px; line-height:1.5; font-weight:500;
  white-space:pre-wrap; word-break:break-word;
  box-shadow:0 1px 2px rgba(15,35,25,.05);
}
.rf-user-time { font-size:10px; color:var(--rf-ink-muted); margin-top:2px; margin-right:4px; text-align:right; }

/* Typing indicator */
.rf-typing {
  background:var(--rf-surface); border:1px solid var(--rf-border-soft);
  padding:12px 16px;
  border-radius:0 12px 12px 12px;
  display:flex; gap:4px; align-items:center;
}
.rf-typing .rf-dot {
  width:7px; height:7px; background:var(--rf-border); border-radius:50%;
  animation:rfBounce 1.2s infinite;
}
.rf-typing .rf-dot:nth-child(2) { animation-delay:.15s; }
.rf-typing .rf-dot:nth-child(3) { animation-delay:.3s; }
@keyframes rfBounce { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-4px);opacity:1} }

/* Options */
.rf-options {
  display:flex; flex-direction:column; gap:6px;
  padding:8px 8px 4px; margin:4px 0;
  max-width:88%; align-self:flex-start;
}
.rf-opt-btn {
  background:var(--rf-surface); border:1px solid var(--rf-border);
  color:var(--rf-ink); padding:10px 14px;
  border-radius:10px; font-size:13px; text-align:left;
  cursor:pointer; transition:all .15s;
  font-family:inherit;
}
.rf-opt-btn:hover { background:var(--rf-surface-tint); border-color:var(--rf-brand); transform:translateX(2px); }
.rf-opt-btn.rf-disabled { opacity:.5; pointer-events:none; }

/* Captura de contacto in-widget — reemplaza al "cierra el chat y escribe por WhatsApp" */
.rf-captura {
  display:flex; flex-direction:column; gap:8px;
  padding:10px; margin:4px 0; max-width:88%; align-self:flex-start;
  background:var(--rf-surface); border:1px solid var(--rf-border); border-radius:10px;
}
.rf-captura-input {
  background:var(--rf-bg); border:1px solid var(--rf-border); color:var(--rf-ink);
  padding:10px 12px; border-radius:8px; font-size:13px; font-family:inherit;
}
.rf-captura-input::placeholder { color:var(--rf-ink-muted); }
.rf-captura-input:focus { outline:none; border-color:var(--rf-brand); }
.rf-captura-btn {
  background:var(--rf-brand); border:none; color:#fff; font-weight:700;
  padding:10px 14px; border-radius:8px; font-size:13px; cursor:pointer;
  font-family:inherit; transition:transform .15s, background .15s;
}
.rf-captura-btn:hover { background:var(--rf-brand-dark); transform:translateY(-1px); }
.rf-captura-btn:disabled { opacity:.6; cursor:default; }
.rf-wa-secundario {
  display:block; text-align:center; color:var(--rf-ink-muted); font-size:12px;
  margin-top:6px;
}

/* Input fake (no editable, solo visual) */
#rf-bot-bottombar {
  background:var(--rf-surface); padding:10px 14px; flex-shrink:0;
  border-top:1px solid var(--rf-border-soft);
  display:flex; align-items:center; gap:10px;
}
#rf-bot-bottombar .rf-input-fake {
  flex:1; background:var(--rf-bg); color:var(--rf-ink-muted);
  border:1px solid var(--rf-border-soft);
  padding:9px 14px; border-radius:22px; font-size:12.5px;
  font-style:italic;
}
#rf-bot-bottombar .rf-wa-btn {
  background:var(--rf-wa); color:#fff; border:none;
  width:36px; height:36px; border-radius:50%;
  cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  text-decoration:none;
}
#rf-bot-bottombar .rf-wa-btn:hover { background:var(--rf-wa-dark); }

/* Precios tables inline — mismos datos, solo recoloreados para fondo
   claro (el valor en verde brillante #86efac era ilegible sobre blanco;
   el título en gris #94a3b8 y la sección en naranja #fb923c no
   alcanzaban contraste 4.5:1 sobre blanco tampoco) */
.rf-precio-tabla {
  font-size:12px; line-height:1.55; color:var(--rf-ink);
}
.rf-precio-tabla .rf-pt-title {
  font-weight:700; color:var(--rf-ink);
  margin-bottom:2px;
}
.rf-precio-tabla .rf-pt-fecha {
  font-size:10px; color:var(--rf-ink-muted); margin-bottom:6px;
}
.rf-precio-tabla .rf-pt-section {
  color:var(--rf-brand-dark); font-weight:700; font-size:11px;
  margin:6px 0 3px; border-bottom:1px solid var(--rf-border);
  padding-bottom:2px;
}
.rf-precio-tabla .rf-pt-row {
  display:flex; justify-content:space-between;
  padding:2px 0;
}
.rf-precio-tabla .rf-pt-row .rf-pt-val { color:var(--rf-brand-dark); font-weight:700; }
.rf-precio-tabla .rf-pt-row .rf-pt-consultar { color:var(--rf-ink-muted); font-size:11px; }

/* Certificados / respaldo legal — antes usaba el patrón "borde de color a
   la izquierda" (anti-patrón de tarjeta), ahora es una tarjeta completa
   con tinte propio (distinto del verde, para seguir señalando "esto es
   legal/oficial") y borde parejo en los 4 lados */
.rf-cert-box {
  background:var(--rf-legal-bg); border:1px solid var(--rf-legal-border);
  padding:10px 12px; border-radius:10px;
  font-size:12px; margin-top:6px;
}
.rf-cert-empresa { font-weight:700; color:var(--rf-legal-ink); font-size:12px; margin-bottom:3px; }
.rf-cert-item { color:var(--rf-legal-ink); font-size:11.5px; line-height:1.6; opacity:.85; }

/* WhatsApp deeplink button — CTA final. Se mantiene el verde de
   WhatsApp (es su propio color de marca reconocible, distinto a
   propósito del verde de Reciclean) con sombra algo más contenida */
.rf-wa-cta {
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:linear-gradient(135deg,var(--rf-wa) 0%,var(--rf-wa-dark) 100%);
  color:#fff; text-decoration:none;
  padding:14px 20px; border-radius:12px;
  font-size:14px; font-weight:700;
  box-shadow:0 6px 16px rgba(37,211,102,.3);
  margin:10px 0;
  transition:transform .2s;
}
.rf-wa-cta:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(37,211,102,.4); }
.rf-wa-cta .rf-wa-icon { font-size:22px; }

/* Responsive mobile */
@media(max-width:480px) {
  #rf-bot-window {
    width:100vw; height:100vh; max-height:100vh;
    bottom:0; right:0; left:0; top:0;
    border-radius:0;
  }
  #rf-bot-toggle { bottom:16px; right:16px; width:56px; height:56px; font-size:26px; }
}

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIGURACIÓN GLOBAL
// ═══════════════════════════════════════════════════════════════
const RF_CONFIG = {
  SUPABASE_URL: 'https://eknmtsrtfkzroxnovfqn.supabase.co',
  SUPABASE_KEY: 'sb_publishable_y-ivpVdiL141kz4ZASje5g_SYG7do5z',
  WHATSAPP: '56995342437',
  WHATSAPP_DISPLAY: '+56 9 9534 2437',
  EMAIL: 'comercial@gestionrepchile.cl',
  VERSION: '1.0-mvp'
};
// Flag de migración: activado para enrutar el widget al intake canónico.
// Si la EF falla, el wrapper conserva fallback al camino legacy.
const RF_USE_INTAKE_V1 = true;

// Estado global del flujo
let rfState = {};
const rfChat = document.getElementById('rf-bot-chat');
const rfWindow = document.getElementById('rf-bot-window');
const rfToggle = document.getElementById('rf-bot-toggle');
const rfToggleIcon = document.getElementById('rf-bot-toggle-icon');

// ═══════════════════════════════════════════════════════════════
// FASE 1 · Identidad del visitante + empresa + mapeo sucursal
// ═══════════════════════════════════════════════════════════════

// Empresa: este archivo vive embebido en un <iframe>, así que
// window.location.hostname es SIEMPRE el dominio de este widget
// (reciclean-sistema.vercel.app), nunca el del sitio que lo embebe.
// Para saber si el visitante está en reciclean.cl o farex.cl hay que
// mirar document.referrer (la URL de la página que cargó el iframe).
const rfEmpresa = (document.referrer && document.referrer.indexOf('farex.cl') !== -1) ? 'farex' : 'reciclean';

// session_id persistente (sobrevive recargas, salvo que localStorage
// esté bloqueado — ej. algunos navegadores restringen storage dentro
// de iframes de terceros; en ese caso cae a un id de memoria que no
// persiste entre recargas, pero no rompe el flujo. Ver pre-mortem T5,
// PROPUESTA-FINAL-CHATBOT-WEB-V2.2.md — pendiente probar en Safari real).
const RF_SESSION_KEY = 'rf_chatbot_session_id';
const rfSessionId = (function () {
  try {
    let s = localStorage.getItem(RF_SESSION_KEY);
    if (s) return s;
    s = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'rf_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    localStorage.setItem(RF_SESSION_KEY, s);
    return s;
  } catch (e) {
    return 'rf_mem_' + Date.now().toString(36);
  }
})();

// Mapeo sucursal → sucursal_id, mismos valores sembrados en
// curated.mapeo_comuna_sucursal (verificado en vivo 03-jul contra
// curated.sucursales: cerrillos/maipu/talca/puerto_montt). Se hardcodea
// acá (en vez de consultar la tabla por REST) porque el rol anon NO
// tiene GRANT SELECT sobre curated.mapeo_comuna_sucursal — pedirlo por
// red solo agregaría una dependencia y un permiso más a gestionar por
// 4 valores fijos que casi no cambian.
const RF_SUCURSAL_ID = {
  'Cerrillos': 'cerrillos',
  'Maipú': 'maipu',
  'Talca': 'talca',
  'Puerto Montt': 'puerto_montt'
};

// Registra un evento en curated.eventos_bot. Fire-and-forget: nunca
// bloquea al visitante si la red falla o si el permiso no está bien
// configurado. GRANT INSERT ya confirmado para anon (DDL_tablas.sql).
function rfTrack(evento, metadata) {
  try {
    fetch(RF_CONFIG.SUPABASE_URL + '/rest/v1/eventos_bot', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': RF_CONFIG.SUPABASE_KEY,
        'Authorization': 'Bearer ' + RF_CONFIG.SUPABASE_KEY,
        'Accept-Profile': 'curated',
        'Content-Profile': 'curated',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ session_id: rfSessionId, evento: evento, metadata: metadata || {} })
    }).catch(function (e) { console.warn('[RF Chatbot] rfTrack falló (no bloqueante):', e); });
  } catch (e) { console.warn('[RF Chatbot] rfTrack falló (no bloqueante):', e); }
}

// Camino legacy: crea la oportunidad en curated.oportunidades al cerrar el flujo.
// Fire-and-forget: no bloquea la generación del enlace de WhatsApp, que
// el visitante debe poder abrir aunque este INSERT falle.
//
// ⚠️ BLOQUEANTE DE DESPLIEGUE — no aplicado todavía en producción:
// requiere GRANT INSERT ON curated.oportunidades TO anon + una política
// RLS que acote qué puede insertar el rol anónimo (no debería poder
// escribir en `responsable` ni fijar `estado` distinto de 'prospeccion').
// Sin ese GRANT, este fetch falla en silencio — mismo patrón defensivo
// que ya usa rfTrack, no rompe el widget si el permiso todavía no existe.
function rfCrearOportunidadLegacy() {
  try {
    const sucursalId = RF_SUCURSAL_ID[rfState.sucursal] || null;
    const materialLabel = rfState.material || 'Consulta general';
    const tituloEmpresa = rfState.empresa === 'farex' ? 'Farex' : 'Reciclean';
    // Mismo fix de título que rfBuildIntakePayload: los 3 servicios nuevos
    // (N3E) no son una venta de material, no deberían salir como "Venta
    // Consulta general". RF_SERVICIO_INTENTS se declara más abajo en el
    // archivo pero ya existe en runtime cuando esta función se llama.
    const esServicioLegacy = RF_SERVICIO_INTENTS.has(rfState.intent);
    const tituloLegacy = esServicioLegacy
      ? (rfState.intent === 'servicio_certificado' ? 'Certificados y respaldo documental'
        : rfState.intent === 'servicio_atencion_empresa' ? 'Atención para empresa'
        : 'Otro requerimiento')
      : materialLabel;

    fetch(RF_CONFIG.SUPABASE_URL + '/rest/v1/oportunidades', {
      method: 'POST',
      headers: {

// Intents de servicio agregados en la rama N3E (rfNodo3e*). No son venta
// de material — usan su propio prefijo de título para no salir como
// "Venta Consulta general" en curated.oportunidades (RF_SERVICIO_INTENTS
// también se reutiliza en rfCrearOportunidadLegacy para el mismo fix).
const RF_SERVICIO_INTENTS = new Set(['servicio_certificado', 'servicio_atencion_empresa', 'servicio_otro']);

function rfBuildIntakePayload(materialLabel, tituloEmpresa) {
  const intentLabels = {
    vender_material: 'Quiero vender material',
    cotizar_retiro: 'Cotizar retiro',
    donar: 'Quiero donar material',
    meditar: 'Me gustaría que me contacten luego',
    materiales_varios: 'Consulta por materiales varios',
    servicio_certificado: 'Certificados y respaldo documental',
    servicio_atencion_empresa: 'Atención para empresa',
    servicio_otro: 'Otro requerimiento'
  };
  const mensajeWhatsapp = rfGenerarMensajeWhatsApp();
  const waLink = 'https://wa.me/' + RF_CONFIG.WHATSAPP + '?text=' + encodeURIComponent(mensajeWhatsapp);
  const esServicio = RF_SERVICIO_INTENTS.has(rfState.intent);
  const tituloLabel = esServicio ? (intentLabels[rfState.intent] || 'Servicio') : materialLabel;
  const tituloPrefijo = esServicio ? 'Servicio' : 'Venta';

  return {
    material: materialLabel,
    cliente_nombre_libre: rfState.nombre_contacto || 'Visitante web anónimo',
    resumen: 'Solicitud comercial desde widget web guiado',
    titulo_referencia: tituloPrefijo + ' ' + tituloLabel + ' — Widget web (' + tituloEmpresa + ')',
    ciudad: rfState.ciudad || null,
    sucursal_label: rfState.sucursal || null,
    intent: rfState.intent || null,
    intent_label: intentLabels[rfState.intent] || 'Consulta comercial desde widget',
    modo_entrega: rfState.modo_entrega || null,
    precio_referencia: typeof rfState.precio === 'number' ? Math.round(rfState.precio) : null,
    tipo_cliente: rfState.tipo_cliente || null,
    requiere_cert_rep: !!rfState.requiere_cert_rep,
    tipo_certificado: rfState.tipo_certificado || null,
    tipo_atencion_empresa: rfState.tipo_atencion_empresa || null,
    whatsapp_prefill_message: mensajeWhatsapp,
    whatsapp_prefill_url: waLink
  };
}

// intent_type es el catálogo del contrato backend (INTENT_TYPES en
// intake-web-contract.ts) — NO se toca ese archivo ni el motor de
// resolución (clasificarNivelAutonomia lee rfState.intent, no esto).
// Antes SIEMPRE se mandaba 'solicitud_cotizacion' sin importar la rama;
// para los 3 servicios nuevos eso describía mal la solicitud, así que acá
// solo se elige, entre valores YA existentes en ese catálogo, el que
// corresponde — 'solicitud_contacto' para lo que no es cotizar un
// material. El resto de las ramas (retiro/venta/donar/etc.) sigue
// mandando exactamente lo mismo que antes.
function rfIntentTypeFor(intent) {
  return RF_SERVICIO_INTENTS.has(intent) ? 'solicitud_contacto' : 'solicitud_cotizacion';
}

function rfCrearIntakeComercial() {
  const sucursalId = RF_SUCURSAL_ID[rfState.sucursal] || null;
  const materialLabel = rfState.material || 'Consulta general';
  const tituloEmpresa = rfState.empresa === 'farex' ? 'Farex' : 'Reciclean';
  const endpoint = RF_CONFIG.SUPABASE_URL + '/functions/v1/intake-comercial-web';
  const payload = rfBuildIntakePayload(materialLabel, tituloEmpresa);

  return fetch(endpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': RF_CONFIG.SUPABASE_KEY,
      'Authorization': 'Bearer ' + RF_CONFIG.SUPABASE_KEY
    },
    body: JSON.stringify({
      surface_id: 'widget_comercial_guiado',
      channel: 'web_publica',
      intent_type: rfIntentTypeFor(rfState.intent),
      requested_handoff: true,
      source_session_ref: rfSessionId,
      source_session_kind: 'chatbot_v2_session_id_origen',
      empresa_contexto: rfEmpresa,
      idioma: 'es',
      source_url: document.referrer || window.location.href,
      sucursal_ref: sucursalId,
      contacto: {
        nombre: rfState.nombre_contacto || null,
        telefono: rfState.telefono_contacto || null,
        email: null
      },
      payload: payload
    })
  }).then(async function (resp) {
    if (!resp.ok) {
      const detail = await resp.text().catch(function () { return ''; });
      throw new Error('HTTP ' + resp.status + ' ' + detail.slice(0, 200));
    }
    return resp.json().catch(function () { return null; });
  });
}

// Devuelve la promesa de la respuesta del intake (o null si usó el camino
// legacy) para que el caller pueda, opcionalmente y sin bloquear el cierre
// del chat, reaccionar a la clasificación real (nivel_autonomia) que calculó
// el motor de resolución en el backend — ver rfNodo7().
function rfCrearCasoComercial() {
  if (!RF_USE_INTAKE_V1) {
    rfCrearOportunidadLegacy();
    return Promise.resolve(null);
  }

  return rfCrearIntakeComercial().catch(function (e) {
    console.warn('[RF Chatbot] intake v1 falló; fallback a legacy:', e);
    rfCrearOportunidadLegacy();
    return null;
  });
}

function rfAddBotMsg(html, delay=0) {

// Escapa meta-caracteres HTML antes de insertar cualquier texto que pueda
// venir de un input del visitante (CodeQL js/xss-through-dom). Los mensajes
// de opciones fijas (labels de botones) no la necesitan pero no les afecta.
function rfEscapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function rfAddUserMsg(text) {
  document.querySelectorAll('.rf-opt-btn').forEach(b => b.classList.add('rf-disabled'));
  const wrap = document.createElement('div');
  wrap.className = 'rf-user-msg';
  wrap.innerHTML = '<div><div class="rf-user-bubble">'+rfEscapeHtml(text)+'</div><div class="rf-user-time">'+rfTime()+' ✓✓</div></div>';
  rfChat.appendChild(wrap);
  rfScroll();
}

function rfAddOptions(opts) {
  const container = document.createElement('div');
  container.className = 'rf-options';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'rf-opt-btn';
    btn.textContent = o.label;
    btn.onclick = () => o.action();
    container.appendChild(btn);
  });
  rfChat.appendChild(container);
  rfScroll();
}

// Captura nombre + teléfono DENTRO del widget (sin salir a WhatsApp).
// onSubmit se dispara solo cuando ambos campos tienen contenido.
function rfAddCapturaContacto(onSubmit) {
  const wrap = document.createElement('div');
  wrap.className = 'rf-captura';
  wrap.innerHTML =
    '<input type="text" class="rf-captura-input" placeholder="Nombre y apellido" />' +
    '<input type="tel" class="rf-captura-input" placeholder="Teléfono de contacto" />' +
    '<button type="button" class="rf-captura-btn">Enviar mis datos ✅</button>';
  rfChat.appendChild(wrap);
  rfScroll();

  const inputs = wrap.querySelectorAll('.rf-captura-input');
  const nombreInput = inputs[0];
  const telInput = inputs[1];
  const btn = wrap.querySelector('.rf-captura-btn');
  const btnLabelOriginal = btn.textContent;

  btn.onclick = () => {
    const nombre = nombreInput.value.trim();
    const telefono = telInput.value.trim();
    if (!nombre || !telefono) {
      btn.textContent = 'Completa ambos datos';
      setTimeout(() => { btn.textContent = btnLabelOriginal; }, 1500);
      return;
    }
    rfState.nombre_contacto = nombre;
    rfState.telefono_contacto = telefono;
    rfAddUserMsg(nombre + ' · ' + telefono);
    nombreInput.disabled = true;
    telInput.disabled = true;
    btn.disabled = true;
    onSubmit();
  };
}

async function rfBotSequence(messages, thenFn, instant=false) {
  for (let i = 0; i < messages.length; i++) {
    if (!instant) {
      rfAddTyping();
      await new Promise(r => setTimeout(r, 800 + Math.random()*300));
      rfRemoveTyping();
    }
    await rfAddBotMsg(messages[i], 0);
    if (!instant && i < messages.length - 1) await new Promise(r => setTimeout(r, 250));
  }
  if (thenFn) thenFn();
}

// SUPABASE · Canasta curada del widget (curated.materiales_widget_config,
// mig 371 + 372). Deny-by-default: un material solo aparece si alguien lo
// ratificó explícitamente para este canal. Reemplaza al viejo esquema
// asistente_snapshot / v_precio_cache, que mostraba CUALQUIER precio vivo
// sin curaduría y disparaba el banner "* precio de respaldo" siempre (la
// fuente "hoy" — asistente_snapshot — está vacía desde 03-jul, así que ese
// banner nunca reflejaba una fuente real, solo la ausencia de curaduría).
// Ver mayordomo/PLAN-2026/WIDGET-CURADURIA-VISIBILIDAD-V1.md.
async function rfFetchCurado(sucursal, filtros) {
  try {
    const qs = new URLSearchParams({ sucursal: 'eq.' + sucursal, order: 'orden_widget.asc.nullslast' });
    Object.keys(filtros || {}).forEach(k => qs.set(k, 'eq.' + filtros[k]));
    const r = await fetch(
      RF_CONFIG.SUPABASE_URL + '/rest/v1/v_widget_materiales_curados?' + qs.toString(),
      { headers: { 'apikey': RF_CONFIG.SUPABASE_KEY, 'Authorization': 'Bearer ' + RF_CONFIG.SUPABASE_KEY } }
    );
    const rows = await r.json();
    return Array.isArray(rows) ? rows : [];
  } catch (e) {
    console.warn('[RF Chatbot] rfFetchCurado falló:', e);
    return [];
  }
}
const rfFetchMetalesCurados = (sucursal) => rfFetchCurado(sucursal, { seccion_widget: 'metales_completo' });
const rfFetchPrincipalCurado = (sucursal) => rfFetchCurado(sucursal, { seccion_widget: 'principal' });

// ═══════════════════════════════════════════════════════════════
// Único material donde empresa=farex no implica esMetal=true: el negocio
// SÍ acepta donación de latas de aluminio (a diferencia de chatarra). No es
// derivable de curated.materiales — se deja explícito acá.
const RF_ES_METAL_OVERRIDE = { 'Aluminio UBC': false };

// Direcciones por sucursal — hoisted desde rfNodo4() para reutilizar en el
// cierre de la ruta de metales (rfNodo3am), sin duplicar los datos.
const RF_DIRECCIONES_SUCURSAL = {
  'Cerrillos': 'Piloto Acevedo #424, Cerrillos, Santiago\n🗺 maps.app.goo.gl/fwcnfB9NxoZ8iSLg8',
  'Maipú': 'Cerro Sombrero #940, Maipú, Santiago\n🗺 maps.app.goo.gl/2ZBAkSqeKwi8YP3d9',
  'Talca': 'Fundo El Sauzal S/N, Chacarillas, Talca\n🗺 maps.app.goo.gl/TmooQP9vxhvGC7kE8',
  'Puerto Montt': 'El Tepual km3, Línea 10 Lote 2, Puerto Montt\n🗺 maps.app.goo.gl/DqtEpj9aKXhVNCZ26'
};

async function rfNodo3a() {
  const sucursal = rfState.sucursal || 'Cerrillos';
  const filas = await rfFetchPrincipalCurado(sucursal);

  rfBotSequence(['¿Qué tipo de material quieres vender?']);

  setTimeout(() => {
    if (filas.length === 0) {
      rfBotSequence([
        'Todavía no tenemos materiales confirmados para este canal en ' + sucursal + '.',
        'Puedes revisar la canasta confirmada de Fierro y otros metales, o dejarnos tu solicitud para orientarte correctamente según material y volumen.'
      ], () => {
        rfAddOptions([
          {
            label:'1. 🔩 Fierro y otros metales (Farex)',
            action: () => { rfAddUserMsg('Fierro y metales'); rfState.esMetal=true; rfState.empresa='farex'; rfNodo3am(); }
          },
          {
            label:'2. Otros materiales',
            action: () => { rfAddUserMsg('Otros materiales'); rfNodo3av(); }
          },
          {
            label:'3. Volver al menú principal',
            action: () => { rfAddUserMsg('Volver al menú'); rfNodo1(); }
          }
        ]);
      });
      return;
    }
    const opts = filas.map(m => {
      const precio = m.modo_widget === 'precio' ? m.precio_lista_clp : null;
      const esMetal = m.empresa === 'farex'
        ? (RF_ES_METAL_OVERRIDE.hasOwnProperty(m.material) ? RF_ES_METAL_OVERRIDE[m.material] : true)
        : false;
      return {
        label: m.material + ' · ' + (precio ? '$' + Math.round(precio).toLocaleString('es-CL') + '/kg' : 'consultar'),
        action: () => {
          rfAddUserMsg(m.material);
          rfState.material = m.material;
          rfState.empresa = m.empresa;
          rfState.esMetal = esMetal;
          rfState.precio = precio;
          rfNodo4();
        }
      };
    });
    opts.push({
      label:'🔩 Fierro y otros metales (Farex)',
      action: () => { rfAddUserMsg('Fierro y metales'); rfState.esMetal=true; rfState.empresa='farex'; rfNodo3am(); }
    });
    opts.push({
      label:'Otros materiales',
      action: () => { rfAddUserMsg('Otros materiales'); rfNodo3av(); }
    });
    rfAddOptions(opts);
  }, 1200);
}

// ═══════════════════════════════════════════════════════════════
// N3A-M · Fierro y Metales Farex (tabla dinámica desde Supabase)
// ═══════════════════════════════════════════════════════════════
async function rfNodo3am() {
  const sucursal = rfState.sucursal || 'Cerrillos';
  const filas = await rfFetchMetalesCurados(sucursal);

  let html = '<div class="rf-precio-tabla">';
  html += '<div class="rf-pt-title">🔧 Metales y Fierros · ' + sucursal + '</div>';
  html += '<div class="rf-pt-fecha">' + new Date().toLocaleDateString('es-CL') + ' · canasta confirmada</div>';

  filas.forEach(m => {
    const valor = m.modo_widget === 'precio' && m.precio_lista_clp
      ? '$' + Math.round(m.precio_lista_clp).toLocaleString('es-CL') + '/kg'
      : 'consultar';
    html += '<div class="rf-pt-row"><span>' + m.material + '</span><span class="rf-pt-val">' + valor + '</span></div>';
  });
  html += '</div>';

  if (filas.length === 0) {
    // Color inline en vez de variable CSS: este <div> se inyecta como texto
    // plano fuera de #rf-bot-container en el momento de construirse (antes
    // de insertarse en el chat), así que necesita su propio valor legible
    // sobre fondo claro — antes era #fb923c (naranja para fondo oscuro,
    // contraste insuficiente sobre blanco).
    html = '<div style="color:#8a5a1e">Todavía no tenemos materiales confirmados para este canal en ' + sucursal + '. Déjanos tus datos y registramos tu solicitud para orientarte correctamente según material y volumen.</div>';
  }

  rfBotSequence([html], () => {
    rfAddOptions([
      { label:'1. Continuar — me interesa vender ✅', action:()=>{
          rfAddUserMsg('Me interesa vender');
          rfState.material = filas.map(m => m.material).join(', ') || 'metales varios';
          rfState.precio = null;
          rfBotSequence([
            '💳 Pago al contado con transferencia bancaria. Contamos con romana eléctrica para el pesaje.',
            '📍 <b>Dirección:</b>\n' + (RF_DIRECCIONES_SUCURSAL[sucursal] || RF_DIRECCIONES_SUCURSAL['Cerrillos']),
            '🕐 <b>Horarios:</b>\nLunes a Jueves: 8:30 — 18:00 hrs\nViernes: 8:30 — 17:00 hrs',
            '⚠ Precio con IVA Retención 19%'
          ], () => {
            rfNodo5a();
          });
      }},
      { label:'2. Cotizar servicio de retiro', action:()=>{ rfAddUserMsg('Cotizar retiro'); rfNodo3c(); }},
      { label:'3. Volver al menú principal', action:()=>{ rfAddUserMsg('Volver al menú'); rfNodo1(); }}
    ]);
  });
}

// N4 · PRECIO DEL MATERIAL
// ═══════════════════════════════════════════════════════════════
function rfNodo4() {
  const ciudad = rfState.ciudad || 'Santiago';
  const sucursal = rfState.sucursal || (ciudad === 'Santiago' ? 'Cerrillos' : ciudad);
  const esMetal = rfState.esMetal;
  const precio = rfState.precio ? '$' + Math.round(rfState.precio).toLocaleString('es-CL') + '/kg' : 'consultar con ejecutivo';
  const material = rfState.material || 'el material';

  const direcciones = RF_DIRECCIONES_SUCURSAL;
  const romana = ciudad === 'Santiago' ? 'Contamos con romana eléctrica para el pesaje.' : 'Contamos con romana para camiones en las instalaciones.';
  const donacion = !esMetal ? '\n\n💚 Si prefieres, también puedes <b>donar</b> estos materiales.' : '';
  const ivaNota = rfState.empresa === 'farex' ? '\n⚠ Precio con IVA Retención 19%' : '\n⚠ Precio sin IVA';

  const seqs = [];
  if (rfState.precio) seqs.push('💰 El precio de compra autorizado para este canal es <b>' + precio + ' para ' + material + '</b>, puesto en nuestra sucursal de ' + sucursal + '.' + ivaNota);
  else seqs.push('💰 Todavía no tenemos un precio autorizado para ' + material + ' en este canal. Déjanos tus datos y registramos tu solicitud para revisarla correctamente.');
  seqs.push('💳 Pago al contado con transferencia bancaria. ' + romana + donacion);
  seqs.push('📍 <b>Dirección:</b>\n' + (direcciones[sucursal] || direcciones['Cerrillos']));
  seqs.push('🕐 <b>Horarios:</b>\nLunes a Jueves: 8:30 — 18:00 hrs\nViernes: 8:30 — 17:00 hrs');
  seqs.push('📝 Si te interesa avanzar, deja tus datos para registrar tu llegada o coordinar mejor la entrega.');

  rfTrack('cotizacion_completa', { material: rfState.material, sucursal: sucursal, empresa: rfState.empresa });

  rfBotSequence(seqs, () => {
    if (esMetal) {
      rfAddOptions([
        { label:'1. Me interesa vender ✅', action:()=>{ rfAddUserMsg('Me interesa vender'); rfNodo5a(); }},
        { label:'2. Cotizar servicio de retiro', action:()=>{ rfAddUserMsg('Cotizar retiro'); rfNodo3c(); }},
        { label:'3. Volver al menú principal', action:()=>{ rfAddUserMsg('Volver al menú'); rfNodo1(); }},
        { label:'4. Lo voy a meditar...', action:()=>{ rfAddUserMsg('Lo voy a meditar'); rfNodo3d(); }}
      ]);
    } else {
      rfAddOptions([
        { label:'1. Me interesa vender ✅', action:()=>{ rfAddUserMsg('Me interesa vender'); rfNodo5a(); }},
        { label:'2. Quiero donar 💚', action:()=>{ rfAddUserMsg('Quiero donar'); rfNodo3b(); }},
        { label:'3. Cotizar servicio de retiro', action:()=>{ rfAddUserMsg('Cotizar retiro'); rfNodo3c(); }},
        { label:'4. Volver al menú principal', action:()=>{ rfAddUserMsg('Volver al menú'); rfNodo1(); }},
        { label:'5. Lo voy a meditar...', action:()=>{ rfAddUserMsg('Lo voy a meditar'); rfNodo3d(); }}
      ]);
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// N7 · CIERRE · Genera WhatsApp deeplink con TODO el state pre-lleno
// ═══════════════════════════════════════════════════════════════
function rfGenerarMensajeWhatsApp() {
  const s = rfState;
  const intent_labels = {
    'vender_material': '💰 Quiero vender material',
    'cotizar_retiro':  '🚛 Cotizar retiro',
    'donar':           '💚 Quiero donar material',
    'meditar':         '🤔 Me gustaría que me contacten luego',
    'materiales_varios': '❓ Consulta materiales varios',
    'servicio_certificado': '📄 Certificados y respaldo documental',
    'servicio_atencion_empresa': '🏢 Atención para empresa',
    'servicio_otro': '💬 Otro requerimiento'
  };
  const header = intent_labels[s.intent] || '📩 Nueva consulta desde el chatbot web';

  let msg = '*' + header + '*\n\n';
  msg += '_Generado desde el chatbot de reciclean.cl_\n\n';

  if (s.ciudad)   msg += '📍 Ciudad: ' + s.ciudad + '\n';
  if (s.sucursal) msg += '📍 Sucursal: ' + s.sucursal + '\n';
  if (s.material) msg += '📦 Material: ' + s.material + '\n';
  if (s.empresa)  msg += '🏷 Empresa: ' + (s.empresa === 'farex' ? 'FAREX' : 'RECICLEAN') + '\n';
  if (s.precio)   msg += '💰 Precio lista: $' + Math.round(s.precio).toLocaleString('es-CL') + '/kg\n';
  if (s.modo_entrega) msg += '🚛 Modo entrega: ' + (s.modo_entrega === 'retiro' ? 'con retiro' : 'entrega propia') + '\n';

  msg += '\n— — — — —\n';
  msg += '*Datos pendientes de llenar:*\n\n';

  if (s.intent === 'vender_material' && s.modo_entrega === 'entrega_propia') {
    msg += '• Nombre y apellido: \n';
    msg += '• RUT: \n';
    msg += '• ¿Venta a nombre de empresa?: \n';
    msg += '• Correo: \n';
    msg += '• Día preferido: \n';
    msg += '• Jornada (AM/PM): \n';
  } else if (s.intent === 'cotizar_retiro') {
    msg += '• Nombre y apellido: \n';
    msg += '• Correo: \n';
    msg += '• Dirección retiro: \n';
    msg += '• Ubicación Google Maps: \n';
    msg += '• Tipo camión (pequeño/ampliroll/no sé): \n';
    msg += '• Kilos aproximados: \n';
    msg += '• ¿Grúa horquilla?: \n';
    msg += '• Día preferido: \n';
    msg += '• Jornada (AM/PM): \n';
    msg += '• Comentarios: \n';
    msg += '\n📸 Por favor adjunta 2 o más fotos del material.';
  } else if (s.intent === 'donar') {
    if (s.tipo_cliente === 'personal') {
      msg += '• Nombre y apellido: \n';
      msg += '• Kilos aproximados: \n';
      msg += '• Día preferido: \n';
      msg += '• Jornada (AM/PM): \n';
    } else {
      msg += '• Nombre empresa: \n';
      msg += '• RUT empresa: \n';
      msg += '• Nombre y RUT de quien traerá el material: \n';
      msg += '• Cargo: \n';
      msg += '• Kilos aproximados: \n';
      msg += '• Día preferido: \n';
      msg += '• Jornada (AM/PM): \n';
      msg += '• Certificado REP Ley 20.920: ' + (s.requiere_cert_rep ? 'SÍ (valor 2,7 UF anuales)' : 'NO') + '\n';
      if (s.requiere_cert_rep) msg += '• Correo para el certificado: \n';
    }
  } else if (s.intent === 'meditar') {
    msg += '• Nombre y apellido: \n';
    msg += '• Canal preferido (WhatsApp / llamada): \n';
  } else if (s.intent === 'materiales_varios') {
    msg += '• Describe los materiales que tienes: \n';
    msg += '• Cantidad aproximada: \n';
    msg += '• Ciudad: \n';
  } else if (s.intent === 'servicio_certificado') {
    const tipoCertLabel = s.tipo_certificado === 'ley_rep' ? 'Certificado Ley REP'
      : s.tipo_certificado === 'recepcion_entrega' ? 'Certificado de entrega ya realizada'
      : 'Por confirmar con el cliente';
    msg += '• Nombre y apellido: \n';
    msg += '• Empresa (si aplica): \n';
    msg += '• Tipo de certificado: ' + tipoCertLabel + '\n';
    msg += '• Correo para enviar el certificado: \n';
  } else if (s.intent === 'servicio_atencion_empresa') {
    const tipoAtencionLabel = s.tipo_atencion_empresa === 'retiro_periodico' ? 'Retiro periódico / contrato recurrente'
      : s.tipo_atencion_empresa === 'alta_cliente' ? 'Empresa nueva, quiere partir como cliente'
      : 'Otra necesidad, por especificar con el cliente';
    msg += '• Nombre y apellido: \n';
    msg += '• Empresa: \n';
    msg += '• Qué necesita: ' + tipoAtencionLabel + '\n';
    msg += '• Día/horario preferido para contacto: \n';
  } else if (s.intent === 'servicio_otro') {
    msg += '• Nombre y apellido: \n';
    msg += '• Detalle de lo que necesita (a confirmar con el cliente): \n';
  }

  msg += '\n_Gracias por contactarnos 💚_';
  return msg;
}

function rfNodo7() {
  // Crear el caso comercial (vía intake v1 o vía legacy, según flag).
  // Se registra SIEMPRE acá, independiente de si el visitante abre WhatsApp
  // o no — WhatsApp ya no es requisito para quedar registrado (R-WIDGET-001).
  // El motor de resolución del backend (intake-comercial-web) clasifica el
  // caso en auto/semi_auto/excepcion — si vuelve como excepción real, se lo
  // decimos al visitante SIN bloquear el cierre normal del chat (llega
  // async, el mensaje principal de abajo ya se mostró igual).
  rfCrearCasoComercial().then(function (resp) {
    // Delay > tiempo de la secuencia principal de abajo, para que este
    // mensaje aparezca DESPUÉS de la confirmación, no antes (la respuesta
    // del backend puede llegar más rápido que la animación de "escribiendo").
    if (resp && resp.nivel_autonomia === 'excepcion') {
      rfAddBotMsg('🧑‍💼 Tu caso quedó marcado para revisión personalizada — un ejecutivo lo va a mirar directamente.', 1600);
    }
  });

  // WhatsApp deeplink — queda como continuación OPCIONAL, no como salida obligatoria.
  const mensaje = rfGenerarMensajeWhatsApp();
  const waLink = 'https://wa.me/' + RF_CONFIG.WHATSAPP + '?text=' + encodeURIComponent(mensaje);
  // rfEscapeHtml: nombre_contacto/telefono_contacto vienen de un <input> del
  // visitante — igual que en rfAddUserMsg, nunca se interpolan crudos en HTML.
  const saludoNombre = rfState.nombre_contacto ? ', ' + rfEscapeHtml(rfState.nombre_contacto) : '';
  const telefonoMsg = rfState.telefono_contacto ? ' al ' + rfEscapeHtml(rfState.telefono_contacto) : '';

  rfBotSequence([
    '✅ <b>¡Listo' + saludoNombre + '!</b> Ya registramos tu solicitud en nuestro sistema' + telefonoMsg + '. Si el caso requiere seguimiento adicional, lo haremos con los datos que ya dejaste.'
  ], () => {
    const wrap = document.createElement('div');
    wrap.className = 'rf-bot-msg';
    wrap.style.maxWidth = '92%';
    wrap.innerHTML =
      '<div style="width:100%">' +
        '<a href="' + waLink + '" target="_blank" class="rf-wa-cta"><span class="rf-wa-icon">💬</span>Continuar por WhatsApp (opcional)</a>' +
        '<span class="rf-wa-secundario">Tu solicitud ya quedó registrada. Este paso es solo si prefieres seguir por ese canal.</span>' +
      '</div>';
    rfChat.appendChild(wrap);
    rfScroll();

    setTimeout(() => {
      rfAddOptions([
        { label:'1. Volver al menú principal', action:()=>{ rfAddUserMsg('Volver al menú'); rfReset(); }},
        { label:'2. No, muchas gracias 👋', action:()=>{ rfAddUserMsg('Muchas gracias'); rfNodofin(); }}
      ]);
    }, 600);
  });
}

function rfNodofin() {
  rfBotSequence(['¡Hasta pronto! Cuando nos necesites, aquí estaremos. 👋♻']);
}
