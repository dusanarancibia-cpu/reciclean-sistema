// LÓGICA DE LA APLICACIÓN

let estado = {
  persona: null,
  preguntas: [],
  indiceActual: 0,
  respuestas: {},
  consentimientoAceptado: false,
  inicioSesion: null,
  tiempoPorPregunta: []
};

const app = document.getElementById('app');
const saveIndicator = document.getElementById('saveIndicator');

function mostrarGuardado() {
  saveIndicator.classList.add('show');
  setTimeout(() => saveIndicator.classList.remove('show'), 1500);
}

function guardarLocal() {
  if (!estado.persona) return;
  const key = `entrevista_${estado.persona.id}`;
  localStorage.setItem(key, JSON.stringify({
    indiceActual: estado.indiceActual,
    respuestas: estado.respuestas,
    consentimientoAceptado: estado.consentimientoAceptado,
    inicioSesion: estado.inicioSesion
  }));
  mostrarGuardado();
}

function cargarLocal(personaId) {
  const key = `entrevista_${personaId}`;
  const data = localStorage.getItem(key);
  return data ? JSON.parse(data) : null;
}

async function guardarSupabase() {
  if (!supabase || !estado.persona) return;
  try {
    await supabase.from('entrevista_respuestas').upsert({
      persona_id: estado.persona.id,
      cuestionario: estado.persona.cuestionario,
      respuestas: estado.respuestas,
      indice_actual: estado.indiceActual,
      ultima_actualizacion: new Date().toISOString()
    }, { onConflict: 'persona_id' });
  } catch (e) {
    console.warn('Supabase guardado falló, usando local:', e);
  }
}

setInterval(() => {
  if (estado.persona && estado.consentimientoAceptado) {
    guardarLocal();
    guardarSupabase();
  }
}, 30000);

// PANTALLA: LOGIN
function renderLogin() {
  app.innerHTML = `
    <div class="header">
      <h1>Entrevista A2 — Grupo Arancibia-Pinto</h1>
      <div class="subtitle">Levantamiento de procesos · Mayo 2026</div>
    </div>
    <div class="card">
      <h2>Ingresa tu clave personal</h2>
      <p style="margin-bottom: 16px; color: var(--gris-medio); font-size: 14px;">Tu clave es individual e intransferible. La recibiste por WhatsApp.</p>
      <input type="text" id="claveInput" placeholder="Ejemplo: AND-2026-AR42" autocomplete="off" autocapitalize="characters" style="font-family: monospace; font-size: 16px; letter-spacing: 1px;">
      <div class="error-msg" id="errorLogin">Clave no válida. Revísala con quien te la envió.</div>
      <div class="actions" style="margin-top: 20px;">
        <button class="btn btn-primary btn-large" id="btnEntrar">Entrar</button>
      </div>
      <p class="privacy-note">🔒 Tus respuestas se guardan cifradas. Solo Dusan Arancibia tiene acceso de lectura.</p>
    </div>
  `;
  document.getElementById('btnEntrar').addEventListener('click', procesarLogin);
  document.getElementById('claveInput').addEventListener('keyup', e => {
    if (e.key === 'Enter') procesarLogin();
  });
}

function procesarLogin() {
  const clave = document.getElementById('claveInput').value.trim().toUpperCase();
  const persona = PERSONAS[clave];
  const errorMsg = document.getElementById('errorLogin');
  if (!persona) {
    errorMsg.classList.add('show');
    return;
  }
  estado.persona = persona;
  estado.preguntas = persona.cuestionario === 'andrea_v4' ? PREGUNTAS_ANDREA : PREGUNTAS_ANDREA;
  // Cargar progreso si existe
  const guardado = cargarLocal(persona.id);
  if (guardado) {
    estado.indiceActual = guardado.indiceActual || 0;
    estado.respuestas = guardado.respuestas || {};
    estado.consentimientoAceptado = guardado.consentimientoAceptado || false;
    estado.inicioSesion = guardado.inicioSesion || new Date().toISOString();
  } else {
    estado.inicioSesion = new Date().toISOString();
  }
  if (!estado.consentimientoAceptado) {
    renderConsentimiento();
  } else {
    renderPregunta();
  }
}

// PANTALLA: CONSENTIMIENTO
function renderConsentimiento() {
  const consentimientoTexto = CONSENTIMIENTO.replace('[NOMBRE_PERSONA]', estado.persona.nombre);
  app.innerHTML = `
    <div class="header">
      <h1>Antes de empezar — ${estado.persona.nombre}</h1>
      <div class="subtitle">Consentimiento informado obligatorio</div>
    </div>
    <div class="card">
      <div class="welcome-message">
        ${MENSAJE_CEO}
      </div>
      <h2>Consentimiento informado</h2>
      <div class="consent-box">${consentimientoTexto}</div>
      <div class="checkbox-row">
        <input type="checkbox" id="aceptaConsentimiento">
        <label for="aceptaConsentimiento">He leído, comprendido y acepto las condiciones del consentimiento informado.</label>
      </div>
      <div class="actions">
        <button class="btn btn-primary btn-large" id="btnAceptarConsent" disabled>Comenzar el cuestionario</button>
      </div>
    </div>
  `;
  const checkbox = document.getElementById('aceptaConsentimiento');
  const btn = document.getElementById('btnAceptarConsent');
  checkbox.addEventListener('change', () => btn.disabled = !checkbox.checked);
  btn.addEventListener('click', () => {
    estado.consentimientoAceptado = true;
    estado.indiceActual = 0;
    guardarLocal();
    guardarSupabase();
    renderPregunta();
  });
}

// PANTALLA: PREGUNTA
function renderPregunta() {
  const total = estado.preguntas.length;
  const idx = estado.indiceActual;
  if (idx >= total) {
    renderFin();
    return;
  }
  const p = estado.preguntas[idx];
  const respuestaPrevia = estado.respuestas[p.id] || {};
  const tiempoEstimadoTotal = total * 1.5;
  const tiempoTranscurrido = idx * 1.5;
  const tiempoRestante = Math.max(1, Math.round(tiempoEstimadoTotal - tiempoTranscurrido));
  const progreso = Math.round((idx / total) * 100);

  let mostrarPausa = idx > 0 && idx % 14 === 0 && !respuestaPrevia._pausaMostrada;

  app.innerHTML = `
    <div class="header">
      <h1>Hola ${estado.persona.nombre} 👋</h1>
      <div class="subtitle">Pregunta ${idx + 1} de ${total} · ~${tiempoRestante} min restantes</div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${progreso}%"></div></div>
      <div class="progress-info"><span>${progreso}%</span><span>Auto-guardado activo 💾</span></div>
    </div>
    ${mostrarPausa ? `<div class="pause-banner show">🛑 Llevas ${idx} preguntas. ¿Tomar 5 minutos antes de seguir? Tus respuestas están guardadas — puedes volver cuando quieras.</div>` : ''}
    <div class="card">
      <span class="silo-label">${p.silo}</span>
      <div class="question">${p.pregunta}</div>
      <button class="example-btn" onclick="document.getElementById('exampleBox').classList.toggle('show')">💡 Quiero un ejemplo</button>
      <div class="example-box" id="exampleBox">${p.ejemplo}</div>
      <div id="opcionesContainer">${renderOpciones(p, respuestaPrevia)}</div>
      ${(p.tipo === 'textaudio' || p.tipo === 'textarea') ? '' : `
      <div class="suggest-box">
        <label>💬 ¿Quieres agregar algo? (opcional)</label>
        <textarea id="comentarioInput" placeholder="Escribe aquí o aprieta el micrófono 🎤" rows="2">${respuestaPrevia.comentario || ''}</textarea>
      </div>`}
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*,.pdf,.xlsx,.xls,.csv,.txt">
        <p>📎 Subir archivo si quieres mostrar algo (opcional)</p>
        <div class="file-name" id="fileName">${respuestaPrevia.archivo || ''}</div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="btnAnterior" ${idx === 0 ? 'disabled style="opacity:0.4"' : ''}>⬅ Anterior</button>
        <button class="btn btn-primary" id="btnSiguiente">${idx === total - 1 ? 'Finalizar ✓' : 'Siguiente ➡'}</button>
      </div>
    </div>
  `;

  document.getElementById('btnAnterior').addEventListener('click', () => {
    guardarRespuesta();
    if (idx > 0) {
      estado.indiceActual--;
      renderPregunta();
    }
  });
  document.getElementById('btnSiguiente').addEventListener('click', () => {
    guardarRespuesta();
    estado.indiceActual++;
    guardarLocal();
    guardarSupabase();
    renderPregunta();
  });
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      document.getElementById('fileName').textContent = file.name;
      // upload a Supabase Storage acá si conectado
      if (!estado.respuestas[p.id]) estado.respuestas[p.id] = {};
      estado.respuestas[p.id].archivo = file.name;
      estado.respuestas[p.id]._fileObj = file;
    }
  });
  conectarOpciones(p);
  conectarAudio(p);
}

function renderOpciones(p, respuestaPrevia) {
  if (p.tipo === 'unica' || p.tipo === 'unica_comentario') {
    return `<div class="options">${p.opciones.map((op, i) => `
      <label class="option ${respuestaPrevia.valor === op ? 'selected' : ''}">
        <input type="radio" name="op" value="${op}" ${respuestaPrevia.valor === op ? 'checked' : ''}>
        <span>${String.fromCharCode(65+i)}) ${op}</span>
      </label>
    `).join('')}</div>`;
  }
  if (p.tipo === 'multiple') {
    const seleccionadas = respuestaPrevia.valor || [];
    return `<div class="options">${p.opciones.map((op, i) => `
      <label class="option ${seleccionadas.includes(op) ? 'selected' : ''}">
        <input type="checkbox" name="op" value="${op}" ${seleccionadas.includes(op) ? 'checked' : ''}>
        <span>${String.fromCharCode(65+i)}) ${op}</span>
      </label>
    `).join('')}</div>`;
  }
  if (p.tipo === 'numero') {
    return `
      <input type="number" id="numInput" min="${p.min}" max="${p.max}" value="${respuestaPrevia.valor || ''}" placeholder="Número del ${p.min} al ${p.max}">
      ${p.permitir_no_se ? `
      <label class="option" style="margin-top: 12px;">
        <input type="checkbox" id="noSe" ${respuestaPrevia.no_se ? 'checked' : ''}>
        <span>No lo he medido nunca</span>
      </label>` : ''}
    `;
  }
  if (p.tipo === 'textarea') {
    return `<textarea id="textaInput" rows="4" placeholder="Escribe tu respuesta...">${respuestaPrevia.valor || ''}</textarea>`;
  }
  if (p.tipo === 'textaudio') {
    return `
      <textarea id="textaInput" rows="5" placeholder="Escribe tu respuesta o usa el micrófono...">${respuestaPrevia.valor || ''}</textarea>
      <div class="audio-controls">
        <button class="btn-audio" id="btnGrabar">🎤 Grabar audio</button>
        <button class="btn-audio" id="btnReproducir" style="display:none">▶️ Escuchar grabación</button>
      </div>
      <div class="audio-status" id="audioStatus"></div>
    `;
  }
  return '';
}

function conectarOpciones(p) {
  if (p.tipo === 'unica' || p.tipo === 'unica_comentario') {
    document.querySelectorAll('.option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        opt.querySelector('input').checked = true;
      });
    });
  }
  if (p.tipo === 'multiple') {
    document.querySelectorAll('.option').forEach(opt => {
      opt.addEventListener('click', e => {
        if (e.target.tagName === 'INPUT') return;
        const inp = opt.querySelector('input');
        inp.checked = !inp.checked;
        opt.classList.toggle('selected', inp.checked);
      });
    });
  }
}

let mediaRecorder = null;
let audioChunks = [];
let audioBlob = null;

function conectarAudio(p) {
  if (p.tipo !== 'textaudio') return;
  const btn = document.getElementById('btnGrabar');
  const btnRep = document.getElementById('btnReproducir');
  const status = document.getElementById('audioStatus');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      btn.classList.remove('recording');
      btn.textContent = '🎤 Grabar de nuevo';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        btnRep.style.display = 'inline-flex';
        status.textContent = `✓ Audio grabado (${Math.round(audioBlob.size / 1024)} KB)`;
        if (!estado.respuestas[p.id]) estado.respuestas[p.id] = {};
        estado.respuestas[p.id]._audioBlob = audioBlob;
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      btn.classList.add('recording');
      btn.textContent = '⏹ Detener grabación';
      status.textContent = 'Grabando...';
    } catch (e) {
      status.textContent = '❌ No se pudo acceder al micrófono. Permítelo en la configuración del navegador.';
    }
  });
  btnRep.addEventListener('click', () => {
    if (!audioBlob) return;
    const url = URL.createObjectURL(audioBlob);
    new Audio(url).play();
  });
}

function guardarRespuesta() {
  const p = estado.preguntas[estado.indiceActual];
  if (!p) return;
  if (!estado.respuestas[p.id]) estado.respuestas[p.id] = {};
  if (p.tipo === 'unica' || p.tipo === 'unica_comentario') {
    const sel = document.querySelector('input[name="op"]:checked');
    estado.respuestas[p.id].valor = sel ? sel.value : null;
  } else if (p.tipo === 'multiple') {
    estado.respuestas[p.id].valor = Array.from(document.querySelectorAll('input[name="op"]:checked')).map(i => i.value);
  } else if (p.tipo === 'numero') {
    const num = document.getElementById('numInput').value;
    const noSe = document.getElementById('noSe')?.checked;
    estado.respuestas[p.id].valor = noSe ? null : (num !== '' ? parseInt(num) : null);
    estado.respuestas[p.id].no_se = noSe;
  } else if (p.tipo === 'textarea' || p.tipo === 'textaudio') {
    estado.respuestas[p.id].valor = document.getElementById('textaInput')?.value || '';
  }
  const com = document.getElementById('comentarioInput');
  if (com) estado.respuestas[p.id].comentario = com.value;
  estado.respuestas[p.id]._timestamp = new Date().toISOString();
}

// PANTALLA: FIN
function renderFin() {
  const tiempoTotal = estado.inicioSesion ? Math.round((new Date() - new Date(estado.inicioSesion)) / 60000) : 0;
  guardarLocal();
  guardarSupabase();
  app.innerHTML = `
    <div class="card success-screen">
      <div class="checkmark">✅</div>
      <h2>Gracias, ${estado.persona.nombre}</h2>
      <p style="font-size: 16px; line-height: 1.6; margin-bottom: 20px;">
        Acabas de dedicar ${tiempoTotal > 0 ? tiempoTotal + ' minutos' : 'tu tiempo'} a algo que nadie te había pedido antes con esta profundidad: contar cómo sostienes el grupo.
      </p>
      <p style="font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: var(--gris-medio);">
        Lo que respondiste aquí no es una auditoría de tu desempeño — es un mapa para que dejes de cargar sola lo que es responsabilidad colectiva.
      </p>
      <div class="welcome-message" style="text-align: left;">
        <strong>Compromiso:</strong> en un plazo máximo de <strong>15 días hábiles</strong> tendrás una reunión 1:1 con Dusan para revisar juntos qué se va a aliviar primero, qué se va a delegar, y qué inversión está dispuesto a hacer la empresa para que tu trabajo sea sostenible.
        <br><br>
        Tus respuestas no se van a archivar — se van a accionar.
      </div>
      <p style="font-size: 13px; color: var(--gris-medio); margin-top: 24px;">Puedes cerrar esta ventana. Tus respuestas ya están guardadas.</p>
    </div>
  `;
}

// ============================================================
// INICIO
// ============================================================
renderLogin();
window.addEventListener('beforeunload', () => {
  if (estado.persona) guardarLocal();
});
</script>
