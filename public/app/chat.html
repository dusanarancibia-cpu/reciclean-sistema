<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1B2A">
<title>Reciclean · Chat Diego</title>
<link rel="manifest" href="/app/manifest.json">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#0D1B2A;
  color:#fff;
  display:flex;
  flex-direction:column;
  height:100vh;
  max-width:480px;
  margin:0 auto;
  overflow:hidden;
}
header{
  background:#0D1B2A;
  padding:14px 16px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
}
.back{
  color:#4FC3F7;
  text-decoration:none;
  font-size:20px;
  padding:4px 8px;
}
.header-info{flex:1}
.tag{color:#4FC3F7;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.title{color:#fff;font-size:15px;font-weight:700;line-height:1.2}
.subtitle{color:#6B8FA8;font-size:11px;margin-top:1px}

#chat{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.bubble{
  max-width:80%;
  padding:10px 14px;
  border-radius:16px;
  font-size:14px;
  line-height:1.45;
  word-wrap:break-word;
  white-space:pre-wrap;
}
.bubble.usuario{
  background:linear-gradient(135deg,#1565C0,#0D47A1);
  color:#fff;
  align-self:flex-end;
  border-bottom-right-radius:4px;
}
.bubble.diego{
  background:rgba(255,255,255,0.06);
  color:#fff;
  align-self:flex-start;
  border:1px solid rgba(79,195,247,0.15);
  border-bottom-left-radius:4px;
}
.bubble.diego::before{
  content:'Diego';
  display:block;
  color:#4FC3F7;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:4px;
}
.bubble.thinking{
  background:rgba(255,255,255,0.04);
  color:#6B8FA8;
  align-self:flex-start;
  font-style:italic;
  font-size:12px;
}
.bubble.error{
  background:#4A1A1A;
  border:1px solid #8B3A3A;
  color:#FF8080;
  font-size:12px;
  align-self:center;
  max-width:90%;
  text-align:center;
}
.bubble.system{
  background:rgba(255,255,255,0.04);
  color:#6B8FA8;
  align-self:center;
  font-size:11px;
  text-align:center;
  border-radius:8px;
  max-width:90%;
}

footer{
  background:#0D1B2A;
  border-top:1px solid rgba(255,255,255,0.06);
  padding:10px 14px 14px;
  position:sticky;
  bottom:0;
  z-index:10;
}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-area{
  flex:1;
  background:#1A2D3E;
  border:1.5px solid #2C3E50;
  border-radius:14px;
  padding:10px 12px;
  color:#fff;
  font-size:15px;
  font-family:inherit;
  resize:none;
  max-height:120px;
  min-height:40px;
  outline:none;
}
.input-area:focus{border-color:#4FC3F7}
.send-btn{
  background:linear-gradient(135deg,#1A7A3C,#0F5A2C);
  border:none;
  color:#fff;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
  flex-shrink:0;
}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>

<header>
  <a class="back" href="/app/" aria-label="Volver">←</a>
  <div class="header-info">
    <div class="tag">Asistente Reciclean</div>
    <div class="title">Diego</div>
    <div class="subtitle" id="header-sub">Conectando…</div>
  </div>
</header>

<div id="chat" aria-live="polite"></div>

<footer>
  <div class="input-row">
    <textarea class="input-area" id="msg" placeholder="Escribí tu mensaje…" rows="1" maxlength="3000"></textarea>
    <button class="send-btn" id="send" type="button" aria-label="Enviar">→</button>
  </div>
</footer>

<script>
// Sub-PR B.3 D-DIEGO-50X-V4 Ola B · chat Diego cliente external PWA Reciclean.
const SUPABASE_URL = 'https://eknmtsrtfkzroxnovfqn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_y-ivpVdiL141kz4ZASje5g_SYG7do5z';

// Validar sesión cliente
let userData = null;
try {
  const raw = sessionStorage.getItem('reciclean_app_user');
  if (raw) userData = JSON.parse(raw);
} catch (e) {}
if (!userData || !userData.telefono) {
  window.location.href = '/app/login.html';
}

document.getElementById('header-sub').textContent = userData.nombre + (userData.empresa ? ' · ' + userData.empresa : '');

const chatEl = document.getElementById('chat');
const msgEl = document.getElementById('msg');
const sendBtn = document.getElementById('send');

function bubble(texto, clase) {
  const div = document.createElement('div');
  div.className = 'bubble ' + clase;
  div.textContent = texto;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

bubble('Hola ' + userData.nombre + ' 👋 Soy Diego, asistente comercial de Reciclean. ¿En qué te ayudo?', 'diego');

msgEl.addEventListener('input', () => {
  msgEl.style.height = 'auto';
  msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px';
});

async function enviar() {
  const texto = msgEl.value.trim();
  if (!texto) return;
  sendBtn.disabled = true;
  bubble(texto, 'usuario');
  msgEl.value = '';
  msgEl.style.height = 'auto';
  const thinking = bubble('Diego está pensando…', 'thinking');
  try {
    const resp = await fetch(SUPABASE_URL + '/functions/v1/diego-chat-process', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'apikey': SUPABASE_KEY,
      },
      body: JSON.stringify({
        cliente_external_telefono: userData.telefono,
        mensaje: texto,
        request_id: crypto.randomUUID(),
      }),
    });
    const data = await resp.json();
    thinking.remove();
    if (!resp.ok || data.error) {
      bubble('Error: ' + (data?.error || ('HTTP ' + resp.status)), 'error');
    } else {
      const reply = data.reply || data.message || data.respuesta || data.assistantMessage || JSON.stringify(data).slice(0, 200);
      bubble(reply, 'diego');
    }
  } catch (e) {
    thinking.remove();
    bubble('Sin conexión. Intentá de nuevo en un momento.', 'error');
  } finally {
    sendBtn.disabled = false;
    msgEl.focus();
  }
}

sendBtn.addEventListener('click', enviar);
msgEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
});

// Service worker para PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(() => {});
}
</script>
</body>
</html>
